apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-scheduler-web
  namespace: food-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-scheduler-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: food-scheduler-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/food-scheduler-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.your-domain.com/api/v1"
            - name: NEXTAUTH_URL
              value: "https://your-domain.com"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: food-scheduler-secrets
                  key: nextauth-secret
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: food-scheduler-web
  namespace: food-scheduler
spec:
  selector:
    app: food-scheduler-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-scheduler-web-hpa
  namespace: food-scheduler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-scheduler-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
